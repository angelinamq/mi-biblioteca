<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animes - Mi Biblioteca</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0d0d0d;
            --accent-color: #e6ccb2; /* Tono Beige */
            --accent-hover: #ffffff;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --danger-color: #ff4d4d;
            --border-color: #222222;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 15px; 
        }

        header { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-bottom: 20px; 
        }

        .emision-badge { 
            background-color: #000; 
            color: #ffffff; 
            padding: 10px 40px; 
            border-radius: 50px; 
            font-size: 20px; 
            font-weight: bold; 
            border: 1px solid var(--accent-color); 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            margin-bottom: 20px;
            text-align: center;
            box-shadow: 0 0 10px rgba(230, 204, 178, 0.15);
        }

        .nav-container {
            width: 100%; 
            max-width: 1200px; 
            display: flex; 
            justify-content: space-between;
            align-items: center; 
            flex-wrap: wrap; 
            gap: 15px; 
            background: #080808;
            padding: 15px; 
            border-radius: 12px; 
            border: 1px solid var(--border-color);
            border-bottom: 2px solid var(--accent-color);
            box-sizing: border-box;
        }

        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        
        .filter-bar a {
            text-decoration: none; 
            color: var(--text-dim); 
            font-weight: bold;
            font-size: 0.75rem; 
            text-transform: uppercase; 
            transition: 0.3s;
            padding: 8px 12px; 
            cursor: pointer; 
            border-radius: 6px;
            background: #121212;
            border: 1px solid #1a1a1a;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .filter-bar a:hover, .filter-bar a.active { 
            color: #000000; 
            background: var(--accent-color); 
            border-color: var(--accent-color);
        }

        .search-wrapper {
            position: relative; 
            display: flex; 
            align-items: center; 
            background: #000000;
            padding: 10px 15px; 
            border-radius: 25px; 
            border: 1px solid #333333; 
            flex-grow: 1; 
            min-width: 200px;
        }
        
        .search-wrapper input { 
            background: transparent; 
            border: none; 
            color: #ffffff; 
            outline: none; 
            width: 100%; 
            font-size: 16px; 
        }
        
        .clear-search {
            position: absolute; 
            right: 40px; 
            cursor: pointer; 
            color: var(--text-dim); 
            font-size: 18px; 
            display: none; 
            z-index: 5;
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 20px; 
            max-width: 1200px; 
            margin: 20px auto; 
        }

        .card { 
            background-color: var(--card-bg); 
            border-radius: 15px; 
            display: flex; 
            padding: 12px; 
            box-shadow: 0 4px 20px rgba(255,255,255,0.02); 
            border: 1px solid var(--border-color);
            transition: 0.3s;
            align-items: flex-start;
        }

        .card:hover {
            border-color: #333333;
        }

        .image-container { 
            flex: 0 0 100px; 
            height: 150px; 
            background: #000; 
            border-radius: 8px; 
            overflow: hidden; 
            margin-right: 12px; 
            border: 1px solid #222222; 
        } 
        
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        .content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        
        h2 { margin: 0 0 5px 0; color: #ffffff; font-size: 1rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }

        .description { 
            font-size: 0.75rem; 
            color: var(--text-dim); 
            margin-bottom: 5px; 
            line-height: 1.3; 
            display: -webkit-box; 
            -webkit-line-clamp: 3; 
            -webkit-box-orient: vertical; 
            overflow: hidden;
            text-align: left;
        }
        .description.expanded { -webkit-line-clamp: unset; display: block; }

        .btn-more {
            background: none; 
            border: none; 
            color: var(--accent-color);
            font-size: 0.7rem; 
            font-weight: bold; 
            cursor: pointer; 
            padding: 5px 0; 
            text-align: left; 
            align-self: flex-start;
        }

        .links-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .circle-link { 
            width: 32px; 
            height: 32px; 
            border-radius: 50%; 
            border: 1px solid var(--accent-color); 
            background: #000000; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            overflow: hidden; 
            transition: 0.2s;
        }
        .circle-link:hover {
            background: var(--accent-color);
        }
        .circle-link img { width: 20px; height: 20px; object-fit: contain; }

        .stats { 
            margin-top: auto; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            padding-top: 8px; 
            border-top: 1px solid #1f1f1f; 
            font-size: 0.7rem; 
        }
        .status-badge { padding: 2px 6px; border-radius: 4px; background: #1a1a1a; color: #ffffff; border: 1px solid #333; font-weight: bold; }
        .season-badge { color: var(--text-dim); font-weight: bold; background: #121212; padding: 2px 6px; border-radius: 4px; border: 1px solid #222; }
        .chapters { color: var(--accent-color); font-weight: bold; }

        #backToTop {
            display: none; 
            position: fixed; 
            bottom: 30px; 
            right: 30px; 
            z-index: 100;
            border: none; 
            outline: none; 
            background-color: var(--accent-color);
            color: #000000; 
            cursor: pointer; 
            width: 50px; 
            height: 50px; 
            border-radius: 50%;
            font-size: 20px; 
            box-shadow: 0 4px 15px rgba(255,255,255,0.1); 
            transition: 0.3s; 
            opacity: 0;
        }

        #backToTop:hover { transform: translateY(-5px); background-color: #ffffff; }

        footer {
            text-align: center; 
            padding: 30px 10px; 
            margin-top: 40px;
            border-top: 1px solid var(--border-color);
            color: var(--text-dim); 
            font-size: 0.8rem; 
            letter-spacing: 1px;
        }
        footer b { color: var(--accent-color); }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .nav-container { flex-direction: column; padding: 12px; }
            .search-wrapper { width: 100%; }
            .grid-container { grid-template-columns: 1fr; gap: 15px; }
            .card { padding: 10px; }
            .image-container { flex: 0 0 85px; height: 130px; }
            h2 { font-size: 0.95rem; }
            .filter-bar a { font-size: 0.7rem; padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="emision-badge">Animes</div>
        <div class="nav-container">
            <nav class="filter-bar">
                <a href="index.html" style="border: 1px solid var(--accent-color); background: #000; color: var(--accent-color);">
                    <i class="fas fa-th-large"></i> Menú Principal
                </a>
                <a onclick="filterByStatus('TODOS')" id="btn-todos" class="active">Ver Todos</a>
                <a onclick="filterByStatus('EMISIÓN')" id="btn-emision">Emisión</a>
                <a onclick="filterByStatus('FINALIZADO')" id="btn-finalizado">Finalizado</a>
                <a onclick="filterByStatus('PAUSA')" id="btn-pausa">Pausa</a>
                <a onclick="filterByStatus('18')" id="btn-18">+18</a>
                
                <a href="nuevo.html" style="border: 1px solid var(--accent-color); background: #000;">
                    <i class="fas fa-plus" style="color: var(--accent-color);"></i> Admin
                </a>
            </nav>
            
            <div class="search-wrapper">
                <input type="text" id="searchInput" list="animeSuggestions" placeholder="Buscar anime..." onkeyup="handleSearchInput()" oninput="toggleClearButton()">
                <datalist id="animeSuggestions"></datalist>
                <i id="clearBtn" class="fas fa-times clear-search" onclick="clearSearch()"></i>
                <i class="fas fa-search" style="color: var(--accent-color)"></i>
            </div>
        </div>
    </header>

    <div class="grid-container" id="anime-grid"></div>

    <button onclick="scrollToTop()" id="backToTop" title="Volver al inicio">
        <i class="fas fa-chevron-up"></i>
    </button>

    <footer>
        <i class="fas fa-code"></i> Realizado por <b>Angelina</b> &copy; 2026
    </footer>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8uwIvihvXob_wQ8BxNF0yJ8bo5HnsoHWp7nVFhM_OJckBS2uZzPapje7vArGEfDprRM58b8cwvGG5/pub?gid=0&single=true&output=csv';
        let allAnimes = []; 
        let currentStatus = 'TODOS';

        const cleanForFilter = (text) => text ? text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim() : "";

        async function loadData() {
            try {
                // Parámetro dinámico para evitar la caché de Google Sheets y del navegador
                const cacheBuster = `&_nocache=${Date.now()}`;
                const response = await fetch(SHEET_URL + cacheBuster);
                const data = await response.text();
                
                // Dividir por líneas y descartar la primera fila (encabezados)
                const rows = data.split(/\r?\n/)
                    .filter(line => line.trim() !== "" && line.split(',')[0].replace(/"/g, '').trim() !== "")
                    .slice(1);
                
                const parsedItems = rows.map(row => {
                    const col = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const cleanCell = (val) => val ? val.replace(/^"|"$/g, '').trim() : "";

                    return {
                        titulo: cleanCell(col[0]),    // Columna A
                        cap: cleanCell(col[1]),       // Columna B
                        estado: cleanCell(col[2]) || "EMISIÓN", // Columna C
                        genero: cleanCell(col[3]),    // Columna D
                        desc: cleanCell(col[4]),      // Columna E
                        l1: cleanCell(col[5]),        // Columna F
                        i1: cleanCell(col[8]),        // Columna I
                        portada: cleanCell(col[11]),  // Columna L
                        tipo_18: cleanCell(col[12]),  // Columna M (18)
                        categoria: cleanCell(col[13]),// Columna N (CATEGORIA)
                        temporada: cleanCell(col[14]) // Columna O (TEMPORADA)
                    };
                });

                // Filtrar únicamente los registros marcados como ANIME o ANIMES en la columna N
                allAnimes = parsedItems.filter(item => {
                    const cat = cleanForFilter(item.categoria);
                    return cat === "ANIME" || cat === "ANIMES";
                });
                
                updateSuggestions(); 
                filterAnimes();
            } catch (e) { 
                console.error("Error cargando datos:", e); 
            }
        }

        function updateSuggestions() {
            const dataList = document.getElementById('animeSuggestions');
            const titulos = [...new Set(allAnimes.map(a => a.titulo))];
            dataList.innerHTML = titulos.map(t => `<option value="${t}">`).join('');
        }

        function handleSearchInput() { filterAnimes(); }

        function toggleClearButton() {
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            clearBtn.style.display = input.value.length > 0 ? 'block' : 'none';
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            toggleClearButton();
            filterAnimes();
            input.focus();
        }

        function toggleDescription(btn) {
            const desc = btn.previousElementSibling;
            const isExpanded = desc.classList.toggle('expanded');
            btn.textContent = isExpanded ? "Menos" : "Más...";
        }

        function renderGrid(list) {
            const grid = document.getElementById('anime-grid');
            if (list.length === 0) {
                grid.innerHTML = `<p style="text-align:center; grid-column: 1/-1; color: var(--text-dim);">No se encontraron animes registrados.</p>`;
                return;
            }
            grid.innerHTML = list.map(item => `
                <article class="card">
                    <div class="image-container">
                        <img src="${item.portada}" onerror="this.src='https://via.placeholder.com/100x150?text=No+Img'">
                    </div>
                    <div class="content">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div class="genre-tag" style="font-size: 0.7rem; color: var(--accent-color);">${item.genero}</div>
                            ${item.tipo_18 === "18" ? `<span style="color:var(--danger-color); font-size:10px; font-weight:bold; border:1px solid; padding:1px 3px; border-radius:3px;">+18</span>` : ''}
                        </div>
                        <h2 title="${item.titulo}">${item.titulo}</h2>
                        <p class="description">${item.desc}</p>
                        ${item.desc.length > 80 ? `<button class="btn-more" onclick="toggleDescription(this)">Más...</button>` : ''}
                        <div class="links-row">
                            ${item.l1 ? `<a href="${item.l1}" target="_blank" class="circle-link"><img src="${item.i1}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/124/124010.png'"></a>` : ''}
                        </div>
                        <div class="stats">
                            <span class="status-badge">${item.estado}</span>
                            ${item.temporada ? `<span class="season-badge">TEMP: ${item.temporada}</span>` : ''}
                            <span class="chapters">CAP: ${item.cap}</span>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function filterByStatus(status) {
            currentStatus = status;
            document.querySelectorAll('.filter-bar a').forEach(el => el.classList.remove('active'));
            
            let btnId;
            if (status === 'TODOS') btnId = 'btn-todos';
            else if (status === '18') btnId = 'btn-18';
            else btnId = `btn-${cleanForFilter(status).toLowerCase()}`;

            const targetBtn = document.getElementById(btnId);
            if (targetBtn) targetBtn.classList.add('active');
            
            filterAnimes();
        }

        function filterAnimes() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allAnimes.filter(a => {
                let matchesStatus = (currentStatus === 'TODOS') ? true : 
                                   (currentStatus === '18') ? (cleanForFilter(a.tipo_18) === "18" || cleanForFilter(a.genero).includes("18")) : 
                                   (cleanForFilter(a.estado) === cleanForFilter(currentStatus));
                
                let matchesSearch = a.titulo.toLowerCase().includes(query);
                return matchesStatus && matchesSearch;
            });
            renderGrid(filtered);
        }

        window.onscroll = function() {
            const btn = document.getElementById("backToTop");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.style.display = "block";
                setTimeout(() => btn.style.opacity = "1", 10);
            } else {
                btn.style.opacity = "0";
                setTimeout(() => { if(btn.style.opacity === "0") btn.style.display = "none"; }, 300);
            }
        };

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        loadData();
    </script>
</body>
</html>
