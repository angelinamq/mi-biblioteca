<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Personal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #d4a373; 
            --text-main: #f5f5f5;
            --text-dim: #b0b0b0;
        }
        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        header { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .emision-badge { background-color: #000; color: white; padding: 10px 40px; border-radius: 50px; font-size: 20px; font-weight: bold; border: 1px solid var(--accent-color); text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px; }
        .nav-container { width: 100%; max-width: 1200px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; background: #252525; padding: 15px; border-radius: 12px; border-bottom: 2px solid var(--accent-color); box-sizing: border-box; }
        .filter-bar { display: flex; gap: 8px; }
        .filter-bar a { text-decoration: none; color: var(--text-dim); font-size: 0.8rem; cursor: pointer; padding: 8px 12px; border-radius: 6px; }
        .filter-bar a.active { color: var(--accent-color); background: rgba(212, 163, 115, 0.15); }
        .search-wrapper { position: relative; display: flex; align-items: center; background: #111; padding: 10px 15px; border-radius: 25px; flex-grow: 1; max-width: 400px; }
        .search-wrapper input { background: transparent; border: none; color: white; outline: none; width: 100%; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 20px; max-width: 1200px; margin: 20px auto; }
        .card { background-color: var(--card-bg); border-radius: 15px; display: flex; padding: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); }
        .image-container { flex: 0 0 100px; height: 150px; background: #000; border-radius: 8px; overflow: hidden; margin-right: 12px; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }
        .content { flex: 1; min-width: 0; }
        h2 { margin: 0 0 5px 0; font-size: 1rem; color: #fff; }
        .description { font-size: 0.75rem; color: var(--text-dim); line-height: 1.3; margin-bottom: 10px; }
        .stats { display: flex; justify-content: space-between; font-size: 0.7rem; border-top: 1px solid #444; padding-top: 8px; }
    </style>
</head>
<body>
    <header>
        <div class="emision-badge">Mi Biblioteca</div>
        <div class="nav-container">
            <nav class="filter-bar">
                <a onclick="filterByStatus('TODOS')" class="active">Inicio</a>
                <a href="nuevo.html">Admin</a>
            </nav>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Buscar título..." onkeyup="filterMangas()">
                <i class="fas fa-search" style="color: var(--accent-color)"></i>
            </div>
        </div>
    </header>
    <div class="grid-container" id="manga-grid"></div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8uwIvihvXob_wQ8BxNF0yJ8bo5HnsoHWp7nVFhM_OJckBS2uZzPapje7vArGEfDprRM58b8cwvGG5/pub?gid=0&single=true&output=csv';
        let allMangas = [];

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                
                // FILTRADO ESTRICTO DE FILAS VACÍAS
                const rows = data.split(/\r?\n/)
                    .filter(line => line.trim() !== "" && line.split(',')[0].replace(/"/g, '').trim() !== "")
                    .slice(1);
                
                allMangas = rows.map(row => {
                    const col = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const clean = (val) => val ? val.replace(/^"|"$/g, '').trim() : "";
                    return {
                        titulo: clean(col[0]),
                        cap: clean(col[1]),
                        estado: clean(col[2]),
                        genero: clean(col[3]),
                        desc: clean(col[4]),
                        portada: clean(col[11])
                    };
                });
                renderGrid(allMangas);
            } catch (e) { console.error(e); }
        }

        function renderGrid(list) {
            const grid = document.getElementById('manga-grid');
            grid.innerHTML = list.map(item => `
                <article class="card">
                    <div class="image-container"><img src="${item.portada}"></div>
                    <div class="content">
                        <h2>${item.titulo}</h2>
                        <p class="description">${item.desc}</p>
                        <div class="stats">
                            <span>${item.estado}</span>
                            <span>CAP: ${item.cap}</span>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function filterMangas() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMangas.filter(m => m.titulo.toLowerCase().includes(query));
            renderGrid(filtered);
        }

        loadData();
    </script>
</body>
</html>
