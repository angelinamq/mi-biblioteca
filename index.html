<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca | Inicio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0d0d0d;
            --accent-color: #e6ccb2; /* Tono Beige */
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --border-color: #222222;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', sans-serif; 
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            width: 100%;
            max-width: 800px;
        }

        .header-badge { 
            background-color: #000; 
            color: #ffffff; 
            padding: 12px 45px; 
            border-radius: 50px; 
            font-size: 1.8rem; 
            font-weight: bold; 
            border: 1px solid var(--accent-color); 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            margin-bottom: 15px;
            text-align: center;
            box-shadow: 0 0 15px rgba(230, 204, 178, 0.15);
        }

        .subtitle {
            color: var(--text-dim);
            font-size: 1rem;
            margin-bottom: 40px;
            letter-spacing: 1px;
            text-align: center;
        }

        .options-grid {
            display: flex;
            gap: 30px;
            width: 100%;
            justify-content: center;
            flex-wrap: wrap;
        }

        .card-option {
            text-decoration: none;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 20px;
            padding: 40px 30px;
            text-align: center;
            width: 240px;
            transition: all 0.3s ease;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
        }

        .card-option i {
            font-size: 3.5rem;
            color: var(--accent-color);
            transition: transform 0.3s ease;
        }

        .card-option span {
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 2px;
            color: var(--text-main);
        }

        .card-option:hover {
            border-color: var(--accent-color);
            transform: translateY(-8px);
            box-shadow: 0 10px 30px rgba(230, 204, 178, 0.2);
            background: #121212;
        }

        .card-option:hover i {
            transform: scale(1.15);
        }

        footer {
            text-align: center; 
            padding: 20px 10px; 
            color: var(--text-dim); 
            font-size: 0.8rem; 
            letter-spacing: 1px;
            border-top: 1px solid var(--border-color);
            width: 100%;
            max-width: 1200px;
            margin-top: 40px;
        }

        footer b { color: var(--accent-color); }

        @media (max-width: 550px) {
            .header-badge { font-size: 1.3rem; padding: 10px 30px; }
            .subtitle { font-size: 0.9rem; margin-bottom: 30px; }
            .options-grid { gap: 20px; }
            .card-option { width: 100%; max-width: 280px; padding: 30px 20px; }
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="header-badge">Bienvenido</div>
        <p class="subtitle">¿Qué deseas explorar hoy?</p>

        <div class="options-grid">
            <a href="manhwas.html" class="card-option">
                <i class="fas fa-book-open"></i>
                <span>MANHWAS</span>
            </a>

            <a href="animes.html" class="card-option">
                <i class="fas fa-tv"></i>
                <span>ANIMES</span>
            </a>
        </div>
    </div>

    <footer>
        <i class="fas fa-code"></i> Realizado por <b>Angelina</b> &copy; 2026
    </footer>

</body>
</html>
