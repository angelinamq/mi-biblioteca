<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Personal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #d4a373; 
            --text-main: #f5f5f5;
            --text-dim: #b0b0b0;
            --danger-color: #ff4d4d;
        }

        body { 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 15px; 
        }

        header { 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            margin-bottom: 20px; 
        }

        .emision-badge { 
            background-color: #000; color: white; padding: 10px 40px; border-radius: 50px; 
            font-size: 20px; font-weight: bold; border: 1px solid var(--accent-color); 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 20px;
            text-align: center;
        }

        .nav-container {
            width: 100%; max-width: 1200px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 15px; background: #252525;
            padding: 15px; border-radius: 12px; border-bottom: 2px solid var(--accent-color);
            box-sizing: border-box;
        }

        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; justify-content: center; }
        
        .filter-bar a {
            text-decoration: none; color: var(--text-dim); font-weight: bold;
            font-size: 0.75rem; text-transform: uppercase; transition: 0.3s;
            padding: 8px 12px; cursor: pointer; border-radius: 6px;
            background: rgba(255,255,255,0.05);
        }

        .filter-bar a:hover, .filter-bar a.active { color: var(--accent-color); background: rgba(212, 163, 115, 0.15); }

        .search-wrapper {
            position: relative; display: flex; align-items: center; background: #111;
            padding: 10px 15px; border-radius: 25px; border: 1px solid #444; 
            flex-grow: 1; min-width: 200px;
        }
        
        .search-wrapper input { 
            background: transparent; border: none; color: white; outline: none; 
            width: 100%; font-size: 16px; 
        }
        
        .clear-search {
            position: absolute; right: 40px; cursor: pointer; color: var(--text-dim); 
            font-size: 18px; display: none; z-index: 5;
        }

        .grid-container { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); 
            gap: 20px; max-width: 1200px; margin: 20px auto; 
        }

        .card { 
            background-color: var(--card-bg); border-radius: 15px; display: flex; 
            padding: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.4); transition: 0.3s;
            align-items: flex-start;
        }

        .image-container { 
            flex: 0 0 100px; height: 150px; background: #000; 
            border-radius: 8px; overflow: hidden; margin-right: 12px; border: 1px solid #444; 
        }
        
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        .content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        
        h2 { margin: 0 0 5px 0; color: #fff; font-size: 1rem; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; }

        .description { 
            font-size: 0.75rem; color: var(--text-dim); margin-bottom: 5px; line-height: 1.3; 
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
            text-align: left;
        }
        .description.expanded { -webkit-line-clamp: unset; display: block; }

        .btn-more {
            background: none; border: none; color: var(--accent-color);
            font-size: 0.7rem; font-weight: bold; cursor: pointer; 
            padding: 5px 0; text-align: left; align-self: flex-start;
        }

        .links-row { display: flex; gap: 8px; margin-bottom: 8px; }
        .circle-link { 
            width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent-color); 
            background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; 
        }
        .circle-link img { width: 20px; height: 20px; object-fit: contain; }

        .stats { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px solid #444; font-size: 0.7rem; }
        .status-badge { padding: 2px 6px; border-radius: 4px; background: #444; color: #fff; font-weight: bold; }
        .chapters { color: var(--accent-color); font-weight: bold; }

        #backToTop {
            display: none; position: fixed; bottom: 30px; right: 30px; z-index: 100;
            border: none; outline: none; background-color: var(--accent-color);
            color: #000; cursor: pointer; width: 50px; height: 50px; border-radius: 50%;
            font-size: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); transition: 0.3s; opacity: 0;
        }

        #backToTop:hover { transform: translateY(-5px); background-color: #fff; }

        /* ESTILO MARCA DE AGUA */
        footer {
            text-align: center; padding: 30px 10px; margin-top: 40px;
            border-top: 1px solid rgba(212, 163, 115, 0.2);
            color: var(--text-dim); font-size: 0.8rem; letter-spacing: 1px;
        }
        footer b { color: var(--accent-color); }

        @media (max-width: 480px) {
            body { padding: 10px; }
            .nav-container { flex-direction: column; padding: 12px; }
            .search-wrapper { width: 100%; }
            .grid-container { grid-template-columns: 1fr; gap: 15px; }
            .card { padding: 10px; }
            .image-container { flex: 0 0 85px; height: 130px; }
            h2 { font-size: 0.95rem; }
            .filter-bar a { font-size: 0.7rem; padding: 6px 10px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="emision-badge">Mi Biblioteca</div>
        <div class="nav-container">
            <nav class="filter-bar">
                <a onclick="filterByStatus('TODOS')" id="btn-todos" class="active">Inicio</a>
                <a onclick="filterByStatus('EMISIÓN')" id="btn-emision">Emisión</a>
                <a onclick="filterByStatus('FINALIZADO')" id="btn-finalizado">Finalizado</a>
                <a onclick="filterByStatus('PAUSA')" id="btn-pausa">Pausa</a>
                <a onclick="filterByStatus('18')" id="btn-18">+18</a>
                
                <a href="nuevo.html" style="border: 1px solid var(--accent-color); background: rgba(212, 163, 115, 0.1);">
                    <i class="fas fa-plus"></i> Admin
                </a>
            </nav>
            
            <div class="search-wrapper">
                <input type="text" id="searchInput" list="mangaSuggestions" placeholder="Buscar título..." onkeyup="handleSearchInput()" oninput="toggleClearButton()">
                <datalist id="mangaSuggestions"></datalist>
                <i id="clearBtn" class="fas fa-times clear-search" onclick="clearSearch()"></i>
                <i class="fas fa-search" style="color: var(--accent-color)"></i>
            </div>
        </div>
    </header>

    <div class="grid-container" id="manga-grid"></div>

    <button onclick="scrollToTop()" id="backToTop" title="Volver al inicio">
        <i class="fas fa-chevron-up"></i>
    </button>

    <!-- MARCA DE AGUA -->
    <footer>
        <i class="fas fa-code"></i> Realizado por <b>Angelina</b> &copy; 2026
    </footer>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8uwIvihvXob_wQ8BxNF0yJ8bo5HnsoHWp7nVFhM_OJckBS2uZzPapje7vArGEfDprRM58b8cwvGG5/pub?gid=0&single=true&output=csv';
        let allMangas = []; 
        let currentStatus = 'TODOS';

        const cleanText = (text) => text ? text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim() : "";

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1);
                
                allMangas = rows.map(row => {
                    const col = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (col.length < 5 || col[0].trim() === "") return null;
                    return {
                        titulo: col[0].replace(/"/g, '').trim(),
                        cap: col[1]?.replace(/"/g, '').trim(),
                        estado: col[2]?.replace(/"/g, '').trim() || "EMISIÓN",
                        genero: col[3]?.replace(/"/g, '').trim(),
                        desc: col[4]?.replace(/"/g, '').trim(),
                        l1: col[5]?.replace(/"/g, '').trim(), 
                        i1: col[8]?.replace(/"/g, '').trim(), 
                        portada: col[11]?.replace(/"/g, '').trim(), 
                        tipo: col[12]?.replace(/"/g, '').trim() 
                    };
                }).filter(m => m !== null);
                
                updateSuggestions(); 
                renderGrid(allMangas);
            } catch (e) { console.error("Error cargando datos:", e); }
        }

        function updateSuggestions() {
            const dataList = document.getElementById('mangaSuggestions');
            const titulos = [...new Set(allMangas.map(m => m.titulo))];
            dataList.innerHTML = titulos.map(t => `<option value="${t}">`).join('');
        }

        function handleSearchInput() { filterMangas(); }

        function toggleClearButton() {
            const input = document.getElementById('searchInput');
            const clearBtn = document.getElementById('clearBtn');
            clearBtn.style.display = input.value.length > 0 ? 'block' : 'none';
        }

        function clearSearch() {
            const input = document.getElementById('searchInput');
            input.value = '';
            toggleClearButton();
            filterMangas();
            input.focus();
        }

        function toggleDescription(btn) {
            const desc = btn.previousElementSibling;
            const isExpanded = desc.classList.toggle('expanded');
            btn.textContent = isExpanded ? "Menos" : "Más...";
        }

        function renderGrid(list) {
            const grid = document.getElementById('manga-grid');
            grid.innerHTML = list.map(item => `
                <article class="card">
                    <div class="image-container">
                        <img src="${item.portada}" onerror="this.src='https://via.placeholder.com/100x150?text=No+Img'">
                    </div>
                    <div class="content">
                        <div style="display: flex; justify-content: space-between; align-items: center;">
                            <div class="genre-tag" style="font-size: 0.7rem; color: var(--accent-color);">${item.genero}</div>
                            ${item.tipo === "18" ? `<span style="color:var(--danger-color); font-size:10px; font-weight:bold; border:1px solid; padding:1px 3px; border-radius:3px;">+18</span>` : ''}
                        </div>
                        <h2 title="${item.titulo}">${item.titulo}</h2>
                        <p class="description">${item.desc}</p>
                        ${item.desc.length > 80 ? `<button class="btn-more" onclick="toggleDescription(this)">Más...</button>` : ''}
                        <div class="links-row">
                            ${item.l1 ? `<a href="${item.l1}" target="_blank" class="circle-link"><img src="${item.i1}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/124/124010.png'"></a>` : ''}
                        </div>
                        <div class="stats">
                            <span class="status-badge">${item.estado}</span>
                            <span class="chapters">CAP: ${item.cap}</span>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function filterByStatus(status) {
            currentStatus = status;
            document.querySelectorAll('.filter-bar a').forEach(el => el.classList.remove('active'));
            let btnId = (status === 'TODOS') ? 'btn-todos' : (status === '18') ? 'btn-18' : `btn-${cleanText(status).toLowerCase()}`;
            const targetBtn = document.getElementById(btnId);
            if (targetBtn) targetBtn.classList.add('active');
            filterMangas();
        }

        function filterMangas() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMangas.filter(m => {
                let matchesStatus = (currentStatus === 'TODOS') ? true : (currentStatus === '18') ? (m.tipo === "18") : (cleanText(m.estado) === cleanText(currentStatus));
                let matchesSearch = m.titulo.toLowerCase().includes(query);
                return matchesStatus && matchesSearch;
            });
            renderGrid(filtered);
        }

        window.onscroll = function() {
            const btn = document.getElementById("backToTop");
            if (document.body.scrollTop > 300 || document.documentElement.scrollTop > 300) {
                btn.style.display = "block";
                setTimeout(() => btn.style.opacity = "1", 10);
            } else {
                btn.style.opacity = "0";
                setTimeout(() => { if(btn.style.opacity === "0") btn.style.display = "none"; }, 300);
            }
        };

        function scrollToTop() { window.scrollTo({ top: 0, behavior: 'smooth' }); }

        loadData();
    </script>
</body>
</html>
