<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Biblioteca Personal</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #1a1a1a;
            --card-bg: #2d2d2d;
            --accent-color: #d4a373; 
            --text-main: #f5f5f5;
            --text-dim: #b0b0b0;
        }

        body { background-color: var(--bg-color); color: var(--text-main); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 20px; }
        header { display: flex; flex-direction: column; align-items: center; margin-bottom: 30px; }

        .emision-badge { 
            background-color: #000; color: white; padding: 10px 40px; border-radius: 50px; 
            font-size: 24px; font-weight: bold; border: 1px solid var(--accent-color); 
            text-transform: uppercase; letter-spacing: 2px; margin-bottom: 25px;
        }

        .nav-container {
            width: 100%; max-width: 1200px; display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 20px; background: #252525;
            padding: 15px 25px; border-radius: 12px; border-bottom: 2px solid var(--accent-color);
        }

        .filter-bar { display: flex; gap: 15px; }
        .filter-bar a {
            text-decoration: none; color: var(--text-dim); font-weight: bold;
            font-size: 0.9rem; text-transform: uppercase; transition: 0.3s;
            padding: 5px 10px; cursor: pointer;
        }
        .filter-bar a:hover, .filter-bar a.active { color: var(--accent-color); }

        .search-wrapper {
            position: relative; display: flex; align-items: center; background: #111;
            padding: 8px 15px; border-radius: 25px; border: 1px solid #444; min-width: 250px;
        }
        .search-wrapper input { background: transparent; border: none; color: white; outline: none; width: 100%; }

        .grid-container { 
            display: grid; grid-template-columns: repeat(auto-fill, minmax(380px, 1fr)); 
            gap: 25px; max-width: 1200px; margin: 20px auto; 
        }
        
        .card { 
            background-color: var(--card-bg); border-radius: 15px; display: flex; 
            padding: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.3); transition: 0.3s;
            align-items: flex-start;
        }

        .image-container { flex: 0 0 120px; height: 180px; background: #111; border-radius: 8px; overflow: hidden; margin-right: 15px; border: 1px solid #444; }
        .image-container img { width: 100%; height: 100%; object-fit: cover; }

        .content { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .genre-tag { font-size: 0.65rem; text-transform: uppercase; color: var(--accent-color); margin-bottom: 5px; font-weight: bold; }
        
        h2 { margin: 0 0 8px 0; color: #fff; font-size: 1.1rem; white-space: normal; line-height: 1.2; }

        /* Estilos para la descripción expandible */
        .description { 
            font-size: 0.8rem; color: var(--text-dim); margin-bottom: 5px; line-height: 1.4; 
            display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; 
            overflow: hidden; transition: all 0.3s ease;
        }
        .description.expanded { -webkit-line-clamp: unset; display: block; }

        .btn-more {
            background: none; border: none; color: var(--accent-color);
            font-size: 0.75rem; font-weight: bold; cursor: pointer;
            padding: 0; margin-bottom: 12px; text-align: left; width: fit-content;
        }

        .links-row { display: flex; gap: 10px; margin-bottom: 10px; }
        .circle-link { width: 35px; height: 35px; border-radius: 50%; border: 1px solid var(--accent-color); background: #000; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .circle-link img { width: 100%; height: 100%; object-fit: cover; }

        .stats { margin-top: auto; display: flex; justify-content: space-between; align-items: center; padding-top: 10px; border-top: 1px solid #444; font-size: 0.75rem; }
        .status-badge { padding: 2px 8px; border-radius: 4px; background: #444; text-transform: uppercase; font-weight: bold; }
        .chapters { color: var(--accent-color); font-weight: bold; }

        @media (max-width: 600px) { .grid-container { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header>
        <div class="emision-badge">Mi Biblioteca</div>
        <div class="nav-container">
            <nav class="filter-bar">
                <a onclick="filterByStatus('TODOS')" id="btn-todos" class="active">Inicio</a>
                <a onclick="filterByStatus('EMISIÓN')" id="btn-emision">Emisión</a>
                <a onclick="filterByStatus('FINALIZADO')" id="btn-finalizado">Finalizado</a>
                <a onclick="filterByStatus('PAUSA')" id="btn-pausa">Pausa</a>
            </nav>
            <div class="search-wrapper">
                <input type="text" id="searchInput" placeholder="Buscar título..." onkeyup="filterMangas()">
                <i class="fas fa-search" style="color: var(--accent-color)"></i>
            </div>
        </div>
    </header>

    <div class="grid-container" id="manga-grid"></div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQqdHFLoW-soBo7YP-IeMArvI8QTGzHhm_g2UuuA1_wfdHXe1JolxYsyXbSBUet6m-_NlUbvZd-Bttz/pub?gid=0&single=true&output=csv';
        let allMangas = []; 
        let currentStatus = 'TODOS';

        const cleanText = (text) => text.normalize("NFD").replace(/[\u0300-\u036f]/g, "").toUpperCase().trim();

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                const rows = data.split(/\r?\n/).slice(1);
                allMangas = rows.map(row => {
                    const col = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    if (col.length < 5 || col[0].trim() === "") return null;
                    return {
                        titulo: col[0].replace(/"/g, '').trim(),
                        cap: col[1]?.trim(),
                        estado: col[2]?.trim() || "EMISIÓN",
                        genero: col[3]?.trim(),
                        desc: col[4]?.replace(/"/g, '').trim(),
                        l1: col[5]?.trim(), l2: col[6]?.trim(), l3: col[7]?.trim(),
                        i1: col[8]?.trim(), i2: col[9]?.trim(), i3: col[10]?.trim(),
                        portada: col[11]?.trim()
                    };
                }).filter(m => m !== null);
                renderGrid(allMangas);
            } catch (e) { console.error("Error cargando datos:", e); }
        }

        function toggleDescription(btn) {
            const desc = btn.previousElementSibling;
            const isExpanded = desc.classList.toggle('expanded');
            btn.textContent = isExpanded ? "Mostrar menos" : "Más...";
        }

        function renderGrid(list) {
            const grid = document.getElementById('manga-grid');
            grid.innerHTML = list.map(item => `
                <article class="card">
                    <div class="image-container">
                        <img src="${item.portada && item.portada !== '[Portada]' ? item.portada : 'https://via.placeholder.com/150x220?text=Sin+Foto'}" onerror="this.src='https://via.placeholder.com/150x220?text=Error'">
                    </div>
                    <div class="content">
                        <div class="genre-tag">${item.genero}</div>
                        <h2 title="${item.titulo}">${item.titulo}</h2>
                        <p class="description">${item.desc}</p>
                        ${item.desc.length > 100 ? `<button class="btn-more" onclick="toggleDescription(this)">Más...</button>` : ''}
                        <div class="links-row">
                            ${item.l1 && item.l1 !== '[Link1]' ? `<a href="${item.l1}" target="_blank" class="circle-link"><img src="${item.i1 || 'https://cdn-icons-png.flaticon.com/512/124/124010.png'}"></a>` : ''}
                            ${item.l2 && item.l2 !== '[Link2]' ? `<a href="${item.l2}" target="_blank" class="circle-link"><img src="${item.i2 || 'https://cdn-icons-png.flaticon.com/512/124/124010.png'}"></a>` : ''}
                            ${item.l3 && item.l3 !== '[Link3]' ? `<a href="${item.l3}" target="_blank" class="circle-link"><img src="${item.i3 || 'https://cdn-icons-png.flaticon.com/512/124/124010.png'}"></a>` : ''}
                        </div>
                        <div class="stats">
                            <span class="status-badge">${item.estado}</span>
                            <span class="chapters">CAP: ${item.cap}</span>
                        </div>
                    </div>
                </article>
            `).join('');
        }

        function filterByStatus(status) {
            currentStatus = status;
            document.querySelectorAll('.filter-bar a').forEach(el => el.classList.remove('active'));
            const btnId = status === 'TODOS' ? 'btn-todos' : `btn-${cleanText(status).toLowerCase()}`;
            if (document.getElementById(btnId)) document.getElementById(btnId).classList.add('active');
            filterMangas();
        }

        function filterMangas() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = allMangas.filter(m => {
                const matchesStatus = (currentStatus === 'TODOS' || cleanText(m.estado) === cleanText(currentStatus));
                return matchesStatus && m.titulo.toLowerCase().includes(query);
            });
            renderGrid(filtered);
        }

        loadData();
    </script>
</body>
</html>
