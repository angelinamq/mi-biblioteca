<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel - InventaSoft</title>
    <style>
        body { background: #0b0b0b; color: #fff; font-family: 'Segoe UI', sans-serif; display: flex; justify-content: center; padding: 20px; }
        .panel { background: #161616; padding: 30px; border-radius: 20px; width: 100%; max-width: 600px; border: 1px solid #d4a37333; }
        h1 { text-align: center; color: #d4a373; font-size: 1.2rem; letter-spacing: 3px; margin-bottom: 30px; }
        .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin-bottom: 15px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.7rem; color: #d4a373; font-weight: bold; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 12px; background: #222; border: 1px solid #333; color: #fff; border-radius: 8px; box-sizing: border-box; outline: none; }
        input:focus { border-color: #d4a373; }
        button { width: 100%; padding: 15px; background: #d4a373; color: #000; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:hover { background: #fff; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>ADMIN PANEL</h1>
        
        <div class="form-group">
            <label>SELECCIONAR PARA ACTUALIZAR</label>
            <select id="selectManga" onchange="fillForm()">
                <option value="">-- Seleccionar manga --</option>
            </select>
        </div>

        <form id="mangaForm">
            <div class="form-group">
                <label>TÍTULO DE LA OBRA</label>
                <input type="text" id="titulo" placeholder="Nombre del manhwa">
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>CAPÍTULO</label>
                    <input type="text" id="cap" placeholder="Ej: 124">
                </div>
                <div class="form-group">
                    <label>ESTADO</label>
                    <select id="estado">
                        <option value="EMISIÓN">EMISIÓN</option>
                        <option value="FINALIZADO">FINALIZADO</option>
                        <option value="PAUSA">PAUSA</option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>GÉNERO</label>
                    <input type="text" id="genero" placeholder="Acción, etc.">
                </div>
                <div class="form-group">
                    <label>CLASIFICACIÓN (18)</label>
                    <select id="tipo">
                        <option value="Publico">Todo Público</option>
                        <option value="18">+18</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>URL PORTADA</label>
                <input type="text" id="portada" placeholder="Link de la imagen">
            </div>

            <div class="form-group">
                <label>DESCRIPCIÓN</label>
                <textarea id="desc" rows="4"></textarea>
            </div>

            <button type="button" onclick="alert('Datos listos para enviar')">ACTUALIZAR DATOS</button>
        </form>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8uwIvihvXob_wQ8BxNF0yJ8bo5HnsoHWp7nVFhM_OJckBS2uZzPapje7vArGEfDprRM58b8cwvGG5/pub?gid=0&single=true&output=csv';
        let allData = [];

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                
                // --- EL PLUS: FILTRADO ESTRICTO ---
                const rows = data.split(/\r?\n/)
                    .filter(line => line.trim() !== "" && line.split(',')[0].replace(/"/g, '').trim() !== "")
                    .slice(1);

                const select = document.getElementById('selectManga');
                select.innerHTML = '<option value="">-- Seleccionar manga --</option>';

                allData = rows.map(row => {
                    const col = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const clean = (val) => val ? val.replace(/^"|"$/g, '').trim() : "";
                    
                    const manga = {
                        titulo: clean(col[0]),
                        cap: clean(col[1]),
                        estado: clean(col[2]),
                        genero: clean(col[3]),
                        desc: clean(col[4]),
                        portada: clean(col[11]),
                        tipo: clean(col[12])
                    };

                    const option = document.createElement('option');
                    option.value = manga.titulo;
                    option.textContent = manga.titulo;
                    select.appendChild(option);
                    
                    return manga;
                });
            } catch (e) { console.error(e); }
        }

        function fillForm() {
            const selected = document.getElementById('selectManga').value;
            const manga = allData.find(m => m.titulo === selected);
            if (manga) {
                document.getElementById('titulo').value = manga.titulo;
                document.getElementById('cap').value = manga.cap;
                document.getElementById('estado').value = manga.estado;
                document.getElementById('genero').value = manga.genero;
                document.getElementById('desc').value = manga.desc;
                document.getElementById('portada').value = manga.portada;
                document.getElementById('tipo').value = manga.tipo;
            }
        }

        loadData();
    </script>
</body>
</html>
