<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        body { background: #000; color: #fff; font-family: sans-serif; display: flex; justify-content: center; padding: 40px; }
        .panel { background: #1a1a1a; padding: 30px; border-radius: 20px; width: 100%; max-width: 500px; border: 1px solid #333; }
        h1 { text-align: center; color: #d4a373; font-size: 1.5rem; }
        .form-group { margin-bottom: 15px; }
        label { display: block; font-size: 0.8rem; color: #d4a373; margin-bottom: 5px; }
        input, select, textarea { width: 100%; padding: 10px; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #d4a373; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="panel">
        <h1>ADMIN PANEL</h1>
        <div class="form-group">
            <label>SELECCIONAR PARA ACTUALIZAR</label>
            <select id="selectManga" onchange="fillForm()">
                <option value="">-- Seleccionar manga --</option>
            </select>
        </div>
        <hr style="border: 0.5px solid #333; margin: 20px 0;">
        <form id="mangaForm">
            <div class="form-group">
                <label>TÍTULO DE LA OBRA</label>
                <input type="text" id="titulo" required>
            </div>
            <div class="form-group">
                <label>ESTADO</label>
                <select id="estado">
                    <option value="EMISIÓN">EMISIÓN</option>
                    <option value="FINALIZADO">FINALIZADO</option>
                </select>
            </div>
            <div class="form-group">
                <label>DESCRIPCIÓN</label>
                <textarea id="desc" rows="3"></textarea>
            </div>
            <button type="button" onclick="alert('Conecta esto con tu Google Apps Script')">GUARDAR CAMBIOS</button>
        </form>
    </div>

    <script>
        const SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8uwIvihvXob_wQ8BxNF0yJ8bo5HnsoHWp7nVFhM_OJckBS2uZzPapje7vArGEfDprRM58b8cwvGG5/pub?gid=0&single=true&output=csv';
        let allData = [];

        async function loadData() {
            try {
                const response = await fetch(SHEET_URL);
                const data = await response.text();
                
                // FILTRADO ESTRICTO PARA NO MOSTRAR OPCIONES BORRADAS
                const rows = data.split(/\r?\n/)
                    .filter(line => line.trim() !== "" && line.split(',')[0].replace(/"/g, '').trim() !== "")
                    .slice(1);

                const select = document.getElementById('selectManga');
                select.innerHTML = '<option value="">-- Seleccionar manga --</option>';

                allData = rows.map(row => {
                    const col = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                    const clean = (val) => val ? val.replace(/^"|"$/g, '').trim() : "";
                    
                    const manga = {
                        titulo: clean(col[0]),
                        estado: clean(col[2]),
                        desc: clean(col[4])
                    };

                    const option = document.createElement('option');
                    option.value = manga.titulo;
                    option.textContent = manga.titulo;
                    select.appendChild(option);
                    
                    return manga;
                });
            } catch (e) { console.error(e); }
        }

        function fillForm() {
            const selected = document.getElementById('selectManga').value;
            const manga = allData.find(m => m.titulo === selected);
            if (manga) {
                document.getElementById('titulo').value = manga.titulo;
                document.getElementById('estado').value = manga.estado;
                document.getElementById('desc').value = manga.desc;
            }
        }

        loadData();
    </script>
</body>
</html>
