<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Biblioteca - Panel de Control</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #000000;
            --card-bg: #0d0d0d;
            --accent-color: #e6ccb2; /* Tono Beige */
            --accent-hover: #ffffff;
            --danger-color: #ff4d4d;
            --text-main: #ffffff;
            --text-dim: #a0a0a0;
            --input-bg: #121212;
            --border-color: #222222;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
            box-sizing: border-box;
        }

        .container {
            background-color: var(--card-bg);
            width: 100%;
            max-width: 500px;
            padding: 25px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(230, 204, 178, 0.05);
            border: 1px solid var(--border-color);
            margin-top: 10px;
        }

        h2 {
            text-align: center; 
            color: #ffffff; 
            margin-bottom: 20px;
            font-weight: 300; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            font-size: 1.4rem;
        }

        .tabs { 
            display: flex; 
            background: #000000; 
            padding: 5px; 
            border-radius: 12px; 
            margin-bottom: 20px; 
            border: 1px solid var(--border-color);
        }

        .tab {
            flex: 1; 
            padding: 12px 5px; 
            text-align: center; 
            cursor: pointer;
            border-radius: 8px; 
            font-weight: bold; 
            font-size: 0.85rem;
            transition: 0.3s; 
            color: var(--text-dim);
        }

        .tab.active { 
            background-color: var(--accent-color); 
            color: #000000; 
        }

        form { display: flex; flex-direction: column; gap: 15px; }
        .row { display: flex; gap: 15px; }
        .input-group { display: flex; flex-direction: column; gap: 5px; flex: 1; }

        label { 
            font-size: 0.7rem; 
            color: var(--accent-color); 
            font-weight: bold; 
            text-transform: uppercase; 
            letter-spacing: 1px;
        }

        input, textarea, select {
            background: var(--input-bg); 
            border: 1px solid var(--border-color); 
            color: #ffffff;
            padding: 12px; 
            border-radius: 10px; 
            font-size: 16px; 
            width: 100%; 
            box-sizing: border-box;
            outline: none;
            transition: 0.3s;
        }
        
        input:focus, textarea:focus, select:focus { 
            border-color: var(--accent-color); 
        }

        .btn-group { display: flex; flex-direction: column; gap: 10px; margin-top: 10px; }

        button {
            background-color: var(--accent-color); 
            color: #000000; 
            border: none;
            padding: 18px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer;
            font-size: 1rem; 
            transition: 0.3s; 
            width: 100%;
        }

        button:hover {
            background-color: var(--accent-hover);
        }

        .btn-delete {
            background-color: transparent;
            color: var(--danger-color);
            border: 1px solid var(--danger-color);
            padding: 12px;
            display: none;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn-delete:hover {
            background-color: var(--danger-color);
            color: #ffffff;
        }

        button:disabled { 
            background-color: #333333; 
            color: #777777;
            cursor: not-allowed; 
        }

        .btn-volver { 
            text-decoration: none; 
            color: var(--text-dim); 
            font-size: 0.9rem; 
            margin-bottom: 10px; 
            display: inline-block; 
            transition: 0.3s;
        }

        .btn-volver:hover {
            color: var(--accent-color);
        }

        footer {
            text-align: center; 
            padding: 25px; 
            width: 100%; 
            max-width: 500px;
            color: var(--text-dim); 
            font-size: 0.8rem; 
            letter-spacing: 1px;
        }

        footer b { color: var(--accent-color); }

        @media (max-width: 480px) { .row { flex-direction: column; gap: 15px; } }
    </style>
</head>
<body>

<div class="container">
    <a href="index.html" class="btn-volver"><i class="fas fa-arrow-left"></i> Volver al Inicio</a>
    <h2>Admin Panel</h2>

    <div class="tabs">
        <div id="tabNuevo" class="tab active" onclick="setMode('nuevo')">Añadir</div>
        <div id="tabActualizar" class="tab" onclick="setMode('actualizar')">Actualizar</div>
    </div>

    <form id="bibliotecaForm" autocomplete="off">
        <input type="hidden" name="accion" id="accionField" value="nuevo">
        
        <div class="row">
            <div class="input-group" style="flex: 2;">
                <label>Título de la Obra *</label>
                <input type="text" name="titulo" id="tituloInput" placeholder="Nombre de la obra" list="listaTitulos" oninput="autoCompletar()">
                <datalist id="listaTitulos"></datalist>
            </div>
            <div class="input-group" style="flex: 1;">
                <label>Categoría</label>
                <select name="categoria" id="categoriaSelect">
                    <option value="MANHWA">MANHWA</option>
                    <option value="ANIME">ANIME</option>
                </select>
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Capítulo / Ep *</label>
                <input type="text" name="capitulo" id="capituloInput" placeholder="Ej: 124 o Ep. 12">
            </div>
            <div class="input-group">
                <label>Temporada / S/N</label>
                <input type="text" name="temporada" placeholder="Ej: Temp 1, T2 o S/N">
            </div>
        </div>

        <div class="row">
            <div class="input-group">
                <label>Estado</label>
                <select name="estado">
                    <option value="EMISIÓN">EMISIÓN</option>
                    <option value="FINALIZADO">FINALIZADO</option>
                    <option value="PAUSA">PAUSA</option>
                </select>
            </div>
            <div class="input-group">
                <label>Clasificación (+18)</label>
                <select name="tipo">
                    <option value="Todo Público">Todo Público</option>
                    <option value="18">+18</option>
                </select>
            </div>
        </div>

        <div class="input-group">
            <label>Género *</label>
            <input type="text" name="genero" id="generoInput" placeholder="Acción, Romántica, etc.">
        </div>

        <div class="input-group">
            <label>URL Portada *</label>
            <input type="text" name="portada" id="portadaInput" placeholder="Link de la imagen">
        </div>

        <div class="row">
            <div class="input-group">
                <label>Link Web (Enlace 1) *</label>
                <input type="text" name="l1" id="l1Input" placeholder="URL para ver/leer">
            </div>
            <div class="input-group">
                <label>Logo Icono (Img 1)</label>
                <input type="text" name="i1" placeholder="URL del logo">
            </div>
        </div>

        <div class="input-group">
            <label>Descripción</label>
            <textarea name="descripcion" rows="3"></textarea>
        </div>

        <div class="btn-group">
            <button type="submit" id="btnEnviar">Añadir a Biblioteca</button>
            <button type="button" id="btnEliminar" class="btn-delete" onclick="eliminarRegistro()">
                <i class="fas fa-trash-alt"></i> Eliminar esta obra
            </button>
        </div>
    </form>
    <div id="statusMsg" style="text-align: center; margin-top: 15px; font-size: 0.85rem; min-height: 20px;"></div>
</div>

<footer>
    Realizado con <i class="fas fa-heart" style="color: var(--accent-color);"></i> por <b>Angelina</b>
</footer>

<script>
    const scriptURL = 'https://script.google.com/macros/s/AKfycbwvLMB689TasCdbmKBd0xxoNH-_irGeiBDv560IiFcP8o-0kQlXoPg36KjmS1cqNCxt/exec';
    const DATOS_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vR8uwIvihvXob_wQ8BxNF0yJ8bo5HnsoHWp7nVFhM_OJckBS2uZzPapje7vArGEfDprRM58b8cwvGG5/pub?gid=0&single=true&output=csv';

    let baseDeDatos = []; 

    const form = document.getElementById('bibliotecaForm');
    const btnEnviar = document.getElementById('btnEnviar');
    const btnEliminar = document.getElementById('btnEliminar');
    const statusMsg = document.getElementById('statusMsg');

    // Bloquear la tecla ENTER para evitar envíos accidentales
    form.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') {
            e.preventDefault();
            return false;
        }
    });

    function setMode(mode) {
        document.getElementById('accionField').value = mode;
        document.getElementById('tabNuevo').classList.toggle('active', mode === 'nuevo');
        document.getElementById('tabActualizar').classList.toggle('active', mode === 'actualizar');
        
        btnEnviar.innerText = mode === 'nuevo' ? "Añadir a Biblioteca" : "Actualizar Registro";
        btnEliminar.style.display = "none";
        
        if(mode === 'nuevo') {
            form.reset();
            statusMsg.innerText = "";
        }
    }

    async function cargarDatos() {
        try {
            const respuesta = await fetch(DATOS_URL + "&cachebuster=" + new Date().getTime());
            const texto = await respuesta.text();
            
            const filas = texto.split(/\r?\n/)
                .filter(line => line.trim() !== "" && line.split(',')[0].replace(/"/g, '').trim() !== "")
                .slice(1);

            const dataList = document.getElementById('listaTitulos');
            dataList.innerHTML = ""; 
            
            baseDeDatos = filas.map(fila => {
                const col = fila.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                const clean = (val) => val ? val.replace(/^"|"$/g, '').trim() : "";

                return {
                    titulo: clean(col[0]),
                    capitulo: clean(col[1]),
                    estado: clean(col[2]),
                    genero: clean(col[3]),
                    descripcion: clean(col[4]),
                    l1: clean(col[5]),
                    i1: clean(col[8]),
                    portada: clean(col[11]),
                    tipo: clean(col[12]) === "18" ? "18" : "Todo Público",
                    categoria: clean(col[13]) || "MANHWA",
                    temporada: clean(col[14]) || "S/N"
                };
            });

            baseDeDatos.forEach(manga => {
                const option = document.createElement('option');
                option.value = manga.titulo;
                dataList.appendChild(option);
            });
        } catch (e) { 
            console.error("Error al cargar datos:", e); 
        }
    }

    function autoCompletar() {
        const modo = document.getElementById('accionField').value;
        const tituloBuscado = document.getElementById('tituloInput').value.trim().toLowerCase();

        if (modo === 'actualizar' && tituloBuscado !== "") {
            const mangaEncontrado = baseDeDatos.find(m => m.titulo.toLowerCase() === tituloBuscado);
            
            if (mangaEncontrado) {
                form.elements['capitulo'].value = mangaEncontrado.capitulo;
                form.elements['temporada'].value = mangaEncontrado.temporada;
                form.elements['estado'].value = mangaEncontrado.estado;
                form.elements['genero'].value = mangaEncontrado.genero;
                form.elements['tipo'].value = mangaEncontrado.tipo;
                form.elements['categoria'].value = mangaEncontrado.categoria;
                form.elements['portada'].value = mangaEncontrado.portada;
                form.elements['l1'].value = mangaEncontrado.l1;
                form.elements['i1'].value = mangaEncontrado.i1;
                form.elements['descripcion'].value = mangaEncontrado.descripcion;
                
                statusMsg.style.color = "#e6ccb2";
                statusMsg.innerText = "✓ Obra encontrada. Los cambios sobrescribirán los datos actuales.";
                btnEliminar.style.display = "block";
            } else {
                statusMsg.style.color = "#ff4d4d";
                statusMsg.innerText = "Obra no encontrada en la base de datos.";
                btnEliminar.style.display = "none";
            }
        }
    }

    function eliminarRegistro() {
        const titulo = document.getElementById('tituloInput').value;
        if (!titulo) return;

        if (confirm(`¿Estás completamente seguro de ELIMINAR "${titulo}"? Esta acción borrará toda su historia.`)) {
            btnEnviar.disabled = true;
            btnEliminar.disabled = true;
            btnEliminar.innerText = "Borrando registro...";

            const formData = new FormData();
            formData.append('accion', 'eliminar');
            formData.append('titulo', titulo);

            fetch(scriptURL, { method: 'POST', body: formData })
            .then(response => response.text())
            .then(result => {
                alert("Obra eliminada permanentemente.");
                form.reset();
                btnEnviar.disabled = false;
                btnEliminar.disabled = false;
                setMode('nuevo');
                cargarDatos();
            })
            .catch(err => {
                alert("Error al intentar eliminar.");
                btnEnviar.disabled = false;
                btnEliminar.disabled = false;
            });
        }
    }

    form.addEventListener('submit', e => {
        e.preventDefault();

        // Validar campos requeridos antes de procesar
        const titulo = document.getElementById('tituloInput').value.trim();
        const capitulo = document.getElementById('capituloInput').value.trim();
        const genero = document.getElementById('generoInput').value.trim();
        const portada = document.getElementById('portadaInput').value.trim();
        const l1 = document.getElementById('l1Input').value.trim();

        if (!titulo || !capitulo || !genero || !portada || !l1) {
            statusMsg.style.color = "#ff4d4d";
            statusMsg.innerText = "⚠️ Por favor completa los campos requeridos marcados con (*)";
            alert("Faltan campos requeridos por completar.");
            
            // Enfocar el primer campo que esté vacío
            if (!titulo) document.getElementById('tituloInput').focus();
            else if (!capitulo) document.getElementById('capituloInput').focus();
            else if (!genero) document.getElementById('generoInput').focus();
            else if (!portada) document.getElementById('portadaInput').focus();
            else if (!l1) document.getElementById('l1Input').focus();
            
            return;
        }

        btnEnviar.disabled = true;
        btnEnviar.innerText = "Sincronizando con Google Sheets...";
        statusMsg.style.color = "#e6ccb2";
        statusMsg.innerText = "Guardando información...";
        
        fetch(scriptURL, { method: 'POST', body: new FormData(form)})
        .then(response => response.text())
        .then(result => {
            alert("¡Base de datos actualizada con éxito!");
            form.reset();
            btnEnviar.disabled = false;
            setMode('nuevo');
            cargarDatos(); 
        })
        .catch(err => {
            alert("Error al guardar los datos.");
            statusMsg.style.color = "#ff4d4d";
            statusMsg.innerText = "Error al conectar con la base de datos.";
            btnEnviar.disabled = false;
        });
    });

    window.onload = cargarDatos;
</script>
</body>
</html>
